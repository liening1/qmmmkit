<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qmmmkit viewer</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0B0D10; overflow: hidden; }
  #viewport { width: 100%; height: 100%; }
  #status {
    position: absolute; top: 12px; left: 12px;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 12px;
    color: #8A93A1; background: rgba(20,23,28,0.7);
    padding: 6px 10px; border-radius: 6px; border: 1px solid #262B33;
    pointer-events: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #hover-tip {
    position: absolute; pointer-events: none;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 11px;
    color: #E6E8EB; background: rgba(11,13,16,0.92);
    padding: 4px 8px; border-radius: 4px; border: 1px solid #2A2F38;
    transform: translate(12px, 12px);
    visibility: hidden;
    z-index: 10;
  }
  #toolbar {
    position: absolute; top: 12px; right: 12px; display: flex; gap: 6px;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  #toolbar button {
    background: rgba(20,23,28,0.7); color: #C7CCD4;
    border: 1px solid #262B33; border-radius: 6px;
    padding: 6px 10px; font-size: 11px; cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #toolbar button:hover { background: #1F2530; color: #FFFFFF; }
  #toolbar button.active { background: #4F8CFF; color: #0B0D10; border-color: #4F8CFF; }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="status">Initialising...</div>
<div id="hover-tip"></div>
<div id="toolbar">
  <button id="btn-cartoon">Cartoon</button>
  <button id="btn-sticks" class="active">Sticks</button>
  <button id="btn-spacefill">Spacefill</button>
  <button id="btn-center">Recentre</button>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="https://unpkg.com/ngl@2.3.1/dist/ngl.js"></script>
<script src="viewer.js"></script>
</body>
</html>
