name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal runtime deps + qmmmkit (without heavy QM stack)
        run: |
          python -m pip install --upgrade pip
          # The mocked-engine tests don't need PySCF/OpenMM/ASH; they only
          # need the Python-side deps. The heavy stack is exercised by
          # scripts/validate_ash_pyscf.py on a workstation/HPC, not in CI.
          python -m pip install \
            "pydantic>=2.6" "PyYAML>=6" "loguru>=0.7" "platformdirs>=4" \
            "numpy" "rich>=13" "typer>=0.12" pytest
          # Install qmmmkit itself without its (heavy) dependencies. We've
          # already installed the deps we actually need above.
          python -m pip install --no-deps -e .

      - name: Compile-check
        run: python -m compileall -q src/ tests/ examples/ scripts/

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  package:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: qmmmkit-dist
          path: dist/
          retention-days: 14
